name: handygo_app
description: "handygo mobile app for clients and workers."
publish_to: "none"

version: 1.0.1+2

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Localization (English / Urdu / Roman Urdu)
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^16.2.0

  # Networking
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0

  # Local storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Connectivity detection (device-level; API result is still the source of truth)
  connectivity_plus: ^6.1.5

  # Functional programming
  fpdart: ^1.1.0

  # Dependency injection
  get_it: ^8.0.0

  # Firebase
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.1
  flutter_local_notifications: ^18.0.1

  # Media & file handling
  image_picker: ^1.1.2
  path_provider: ^2.1.5

  # Maps & Location
  geolocator: ^13.0.2
  google_maps_flutter: ^2.9.0
  google_maps_flutter_android: ^2.14.16
  geocoding: ^3.0.0
  permission_handler: ^11.3.1

  # Audio recording & playback
  record: ^6.2.0
  audioplayers: ^6.4.0

  # WebSocket (Socket.IO v4 client)
  socket_io_client: ^2.0.3+1

  # Date formatting (0.20.x is required by flutter_localizations)
  intl: ^0.20.2

  # Video metadata
  video_player: ^2.9.2

  # External URL / maps launching
  url_launcher: ^6.3.1

  # Runtime app version/build number (About page, Settings)
  package_info_plus: ^8.1.2

  # OTP input / SMS autofill
  pinput: ^6.0.2
  smart_auth: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

  # Directly imported (not just transitive) by
  # test/core/storage/secure_storage_service_test.dart to swap
  # FlutterSecureStoragePlatform.instance for a recording fake.
  flutter_secure_storage_platform_interface: ^1.1.2

  # Directly imported (not just transitive) by
  # test/core/location/location_availability_test.dart to swap
  # GeolocatorPlatform.instance for a fake — same pattern as above.
  geolocator_platform_interface: ^4.2.6

  # Directly imported (not just transitive) by
  # test/core/permissions/media_permission_helper_test.dart and
  # test/core/notifications/notification_permission_service_test.dart to
  # swap PermissionHandlerPlatform.instance for a fake — same pattern.
  permission_handler_platform_interface: ^4.3.0

flutter:
  uses-material-design: true

  # Runs gen-l10n from l10n.yaml on every build.
  generate: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/logo-green.png"
  background_color: "#FFFEFB"
  adaptive_icon_background: "#FFFEFB"
  adaptive_icon_foreground: "assets/images/logo-green.png"