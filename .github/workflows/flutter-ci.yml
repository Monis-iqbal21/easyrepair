# Flutter CI — verification without a local toolchain.
#
# Why this exists: nobody on the team could run `flutter analyze` or
# `flutter test` without borrowing a machine that had Flutter installed, so
# design work was reaching `main` unverified. A GitHub runner has open network
# access to pub.dev and Google's SDK hosts, which no other environment we work
# in does, so it can do the whole check on every push — for free, because this
# repository is public.
#
# What it CANNOT do: build a signed release APK. `android/key.properties` is
# deliberately not in version control, and `app/build.gradle.kts` throws rather
# than fall back to the debug key — that guard is correct and stays. The APK
# below is therefore a DEBUG build: fine for installing on a phone to look at,
# never something to ship. To produce a release APK here, the keystore and its
# passwords would have to be added as repository secrets — a separate decision.

name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: easyrepair_app

jobs:
  verify:
    name: analyze · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
        # pubspec.yaml asks for Dart ^3.10.4. If a future stable ever drops
        # below that this step fails loudly, and the fix is to pin
        # `flutter-version:` here rather than to loosen the constraint.

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # ── The check that matters most ──────────────────────────────────────
      #
      # `lib/l10n/app_localizations*.dart` are generated files that live in the
      # repository. When a new ARB key is added by someone without a Flutter
      # SDK, they have to be written by hand — and a hand-written generated
      # file is a guess until something regenerates it. This step regenerates
      # them and fails if the result differs by so much as a space.
      - name: Regenerate localizations and check they match
        run: |
          flutter gen-l10n
          if ! git diff --exit-code -- lib/l10n; then
            echo "::error::flutter gen-l10n produced a different result than the committed files. The committed localizations are wrong — fix them at the source rather than committing this output."
            exit 1
          fi
          echo "Generated localizations match the committed files."

      # Both of these copy their output into the job summary as well as the
      # log. Raw run logs need credentials the API does not hand out, so
      # without this the reason for a red run can only be read by a human
      # opening the web page — which defeats the point of CI reporting to
      # whoever is actually doing the work.
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee /tmp/analyze.txt

      - name: Test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test 2>&1 | tee /tmp/test.txt

      # Values come in as environment variables and the markdown is written
      # with printf, never with a double-quoted echo. Actions runs `bash -e`,
      # so a backtick inside double quotes is command substitution: writing
      # "### Analyze — \`success\`" made bash try to *run* `success`, which
      # exited 127 and failed this step even when analyze and test had both
      # passed. Single-quoted printf formats keep backticks literal.
      - name: Report analyze and test
        if: always()
        env:
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          {
            printf '### Analyze — `%s`\n\n' "$ANALYZE_OUTCOME"
            printf '```\n'
            tail -80 /tmp/analyze.txt 2>/dev/null || printf '(no output)\n'
            printf '```\n\n'
            printf '### Test — `%s`\n\n' "$TEST_OUTCOME"
            printf '```\n'
            tail -80 /tmp/test.txt 2>/dev/null || printf '(no output)\n'
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          # The job still fails if either did. `continue-on-error` above only
          # defers that, so the summary and the APK are produced first.
          failed=
          [ "$ANALYZE_OUTCOME" = "success" ] || failed=1
          [ "$TEST_OUTCOME" = "success" ] || failed=1
          if [ -n "$failed" ]; then
            echo "::error::analyze=$ANALYZE_OUTCOME test=$TEST_OUTCOME — see the job summary"
            exit 1
          fi
          echo "analyze and test both passed"

      # ── Debug APK ────────────────────────────────────────────────────────
      #
      # Runs even when analyze or test failed, so there is always something to
      # install and look at. The job still reports red in that case.
      #
      # The dart-defines matter: without them the app builds fine and then
      # cannot reach the backend at all, which made the first APK produced here
      # useless on a real phone. The two URLs are not secrets — they are the
      # public production endpoint and are baked into every shipped APK anyway.
      #
      # GOOGLE_MAPS_API_KEY is passed as an *environment variable*, not only as
      # a dart-define, because `android/app/build.gradle.kts` reads it via
      # findProperty -> System.getenv -> local.properties to fill the
      # `${MAPS_API_KEY}` manifest placeholder. A dart-define alone never
      # reaches the manifest. It is optional: without the secret the build
      # still succeeds and only the map fails to render.
      #
      # NOTE FOR WHOEVER INSTALLS THIS: applicationId is `ai.handygo.app` and
      # the debug build carries no suffix, so this APK has the same package
      # name as a release install but a different signature. Android refuses
      # that with "App not installed" — uninstall the existing app first.
      - name: Build debug APK
        if: always()
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL=https://handygo-production-jqi9i.ondigitalocean.app/api/v1 \
            --dart-define=WS_URL=https://handygo-production-jqi9i.ondigitalocean.app \
            --dart-define=GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY"

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handygo-debug-apk
          path: easyrepair_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 30

      # ── Hardcoded-colour count ───────────────────────────────────────────
      #
      # The Ustaad screens are being moved onto `core/theme/app_semantic_colors.dart`
      # one at a time. This prints the count for the screens already converted
      # so the claim is machine-checked on every run instead of taken on trust.
      # It reports; it does not gate — the remaining screens have not been
      # converted yet, and failing on them would just be noise.
      - name: Hardcoded-colour report
        if: always()
        run: |
          {
            echo "### Hardcoded colours in the converted Ustaad screens"
            echo ""
            echo "| File | \`0xFF\` | \`Colors.\` |"
            echo "|---|---|---|"
            for f in \
              lib/features/worker/presentation/pages/worker_home_page.dart \
              lib/features/worker/presentation/pages/worker_new_jobs_page.dart \
              lib/features/worker/presentation/widgets/worker_bottom_nav_bar.dart
            do
              hex=$(grep -c "0xFF" "$f" || true)
              col=$(grep -cE '(^|[^a-zA-Z])Colors\.' "$f" || true)
              echo "| \`$(basename "$f")\` | $hex | $col |"
            done
            echo ""
            echo "Expected: 0 everywhere, except one \`Colors.transparent\` in"
            echo "\`worker_home_page.dart\` — the bottom sheet's background, which"
            echo "is the absence of a colour rather than a choice of one."
          } >> "$GITHUB_STEP_SUMMARY"
